font_family Hack Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Dont touch the stuff from the above.

# background colour
background #222530

# foreground, e.g. font colour

foreground #eeeeee

# background opacity (1.0 = fully opaque, 0 = fully transparent)
background_opacity   0.5
background_blur      5

# cursor
cursor_shape        beam
cursor_blink_interval 0

# Scrollback loger making. 
Scrollback 100000
